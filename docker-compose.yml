---
services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: ${POSTGRES_IMAGE:-ghcr.io/kugeleis/boxmatrix-loader-db:latest}
    container_name: ${POSTGRES_CONTAINER_NAME:-boxmatrix-postgres}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Admin credentials (set via .env)
      POSTGRES_USER: ${POSTGRES_USER:-boxmatrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boxmatrix}
      POSTGRES_DB: ${POSTGRES_DB:-boxmatrix}
      # Writer / reader role credentials from .env
      WRITER_PASSWORD: ${WRITER_PASSWORD:-boxmatrix_writer_pw}
      READER_PASSWORD: ${READER_PASSWORD:-boxmatrix_reader_pw}
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=${POSTGRES_DB:-boxmatrix}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backups:/backups   # Mount the host backups directory into the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boxmatrix} -d ${POSTGRES_DB:-boxmatrix}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${PGADMIN_CONTAINER_NAME:-boxmatrix-pgadmin}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_PORT:-5433}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-${POSTGRES_USER:-boxmatrix}@foobarpg.org}
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-boxmatrix}
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "true"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        python3 -c "
        import os
        with open('/pgadmin4/servers.json') as f: content = f.read()
        expanded = os.path.expandvars(content)
        with open('/tmp/servers.json', 'w') as f: f.write(expanded)
        " && exec /entrypoint.sh

volumes:
  pgdata:
  pgadmin-data:
